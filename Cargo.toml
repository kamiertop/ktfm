[workspace]
resolver = "3"
members = [
  "crates/archive",
  "crates/settings",
  "crates/daemon",
  "crates/gui",
  "crates/sys",
  "crates/vfs"
]

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
hex_color = "3.0.0"
turso = { version = "0.9.0-pre.5", default-features = false }
uuid = "1.29.2"
chrono = "0.4.45"
