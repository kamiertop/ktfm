[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
async-io = "2.6"
vfs = { path = "../vfs" }
sys = { path = "../sys" }
tempfile = "3.27"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }


[dev-dependencies]
rayon = "1.12"

[[bench]]
name = "file_sort"
harness = false
