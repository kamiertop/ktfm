[package]
name = "gui"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = "0.10.0"
anyhow.workspace = true
async-channel = "2.5"
alacritty_terminal = { version = "0.26", default-features = false }
directories.workspace = true
daemon = { path = "../daemon" }
settings = { path = "../settings" }
sys = { path = "../sys" }
vfs = { path = "../vfs" }
hex_color.workspace = true
rust-embed = { version = "8.13", features = ["debug-embed"] }
serde_json = "1"
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
